<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>大衍帝国 · 单机版</title>
<style>
:root{
  --paper:#f6f3ec; --paper-2:#fffdf8; --paper-3:#efe9de;
  --ink:#221f1b; --ink-2:#574f45; --ink-3:#8b8377;
  --line:#e3dcd0; --line-2:#d2c8b8;
  --seal:#9c2b2b; --seal-soft:#f3e3e1;
  --jade:#2f6f4e; --jade-soft:#e2efe7;
  --gold:#8a6d2b; --gold-soft:#f4ecda;
  --slate:#4a5568; --slate-soft:#e8eaf0;
  --r:10px; --r-sm:7px;
  --sh:0 1px 2px rgba(60,50,35,.06),0 2px 8px rgba(60,50,35,.05);
  --sh-md:0 2px 6px rgba(60,50,35,.08),0 12px 32px rgba(60,50,35,.10);
  --font:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,"Microsoft YaHei",serif;
  --font-ui:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
/* 移动端：禁止横屏字号自动放大、去掉双击缩放延迟 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,select,a{touch-action:manipulation}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
img,table{max-width:100%}
.hidden{display:none !important}
h1,h2,h3,h4{margin:0;font-weight:500;font-family:var(--font)}

.btn{border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px);box-shadow:var(--sh)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.primary:hover:not(:disabled){background:#862424}
.btn.jade{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.block{width:100%;text-align:center}
/* 顶栏主按钮的两种文案：窄屏用短版，否则会在小屏被裁 */
.lb-mini{display:none}
input,select{border:1px solid var(--line-2);background:var(--paper-2);border-radius:var(--r-sm);padding:7px 10px;outline:none}
input:focus,select:focus{border-color:var(--gold)}

.wrap{max-width:1280px;margin:0 auto;padding:0 16px 40px}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:40;background:linear-gradient(var(--paper-2),var(--paper));border-bottom:1px solid var(--line);padding:10px 0}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font);font-size:19px;letter-spacing:2px}
/* 顶栏印章。类名刻意不叫 .seal —— 那会连带命中 <span class="pill seal">，
   把官阶标签撑成 30×30 的方块、文字变白 */
.brand-seal{width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--font);font-size:17px;flex:none}
.strip{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-left:auto}
.strip b{color:var(--ink);font-weight:500}
.strip .warn{color:var(--seal)}

/* ── 主体：宽屏三栏 → 中屏两栏 → 手机单列 ── */
.grid{display:grid;grid-template-columns:230px minmax(0,1fr) 320px;gap:16px;margin-top:16px;align-items:start}
@media (min-width:1500px){.wrap{max-width:1440px}.grid{grid-template-columns:260px minmax(0,1fr) 360px}}
@media (max-width:1080px){
  .grid{grid-template-columns:200px minmax(0,1fr);gap:14px}
  .rail{grid-column:1/-1}
}

.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:4px}
/* 标题里的标签：按内容宽度渲染，不参与 flex 收缩
   （否则 CJK 的最小内容宽度只有 1 个字，"从九品书办" 会被压成竖排） */
.card h3 .pill{margin-left:auto;flex:none;width:max-content;max-width:100%}
/* 标签一律不折行、不被压扁 —— 窄容器里 "从九品书办" 曾被挤成竖排两列。
   CJK 的 min-content 只有一个字宽，故必须用 max-content 撑开，否则 flex 会把它压到 1 字宽 */
.pill{display:inline-block;background:var(--paper-3);border:1px solid var(--line-2);border-radius:20px;padding:1px 9px;font-size:12px;color:var(--ink-2);white-space:nowrap;flex:none;width:max-content;max-width:100%}
.pill.seal{background:var(--seal-soft);border-color:#e6c9c6;color:var(--seal)}
.pill.jade{background:var(--jade-soft);border-color:#c6e0d1;color:var(--jade)}
.pill.gold{background:var(--gold-soft);border-color:#e6d7ae;color:var(--gold)}
.pill.slate{background:var(--slate-soft);border-color:#cfd5e0;color:var(--slate)}

/* ── 属性条 ── */
.stat{margin-bottom:9px}
.stat-top{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:3px}
.bar{height:7px;background:var(--paper-3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.b-merit{background:var(--jade)} .b-renown{background:#3d7ea6}
.b-guile{background:var(--gold)} .b-network{background:var(--slate)}
.b-favor{background:var(--seal)} .b-exposure{background:#7a4a1e}
.b-health{background:#5f8f6a}

/* ── Tab ── */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:none;background:transparent;padding:8px 14px;cursor:pointer;color:var(--ink-3);border-bottom:2px solid transparent;font-size:14px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--seal)}

/* ── 行动卡 ── */
.act{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:9px;background:var(--paper-2)}
.act-h{display:flex;align-items:center;gap:8px;font-weight:500}
.act-h .cost{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.act-d{font-size:12.5px;color:var(--ink-2);margin:3px 0 8px}
.acts-group{margin-bottom:18px}
.acts-group .g-title{font-size:13px;color:var(--ink-3);letter-spacing:1px;margin:0 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line-2)}

/* ── 列表 ── */
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--r-sm);cursor:pointer;border:1px solid transparent;flex-wrap:wrap;row-gap:4px}
.row:hover{background:var(--paper-3);border-color:var(--line)}
.row.on{background:var(--gold-soft);border-color:#e6d7ae}
.row .nm{font-weight:500}
.row .sub{font-size:12px;color:var(--ink-3)}
.row .rt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.list{max-height:340px;overflow-y:auto}

.gaz{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line);color:var(--ink-2)}
.gaz:last-child{border-bottom:none}
.gaz .t{color:var(--ink-3);font-size:11px;margin-right:6px}

/* ── 弹窗 ── */
.mask{position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.mask.on{display:flex}
.modal{background:var(--paper-2);border-radius:var(--r);box-shadow:var(--sh-md);width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--font);font-size:16px;display:flex;align-items:center}
.modal-h .x{margin-left:auto;cursor:pointer;color:var(--ink-3);border:none;background:none;font-size:20px;line-height:1}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.opt{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px;cursor:pointer;background:var(--paper-2)}
.opt:hover:not(.dis){border-color:var(--gold);background:var(--gold-soft)}
.opt.dis{opacity:.45;cursor:not-allowed}
.opt .l{font-weight:500}
.opt .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.opt .c{font-size:12px;color:var(--ink-3);margin-top:3px}

.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--ink);color:var(--paper-2);padding:9px 14px;border-radius:var(--r-sm);font-size:13px;box-shadow:var(--sh-md);max-width:340px;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.toast.bad{background:var(--seal)}
.toast.good{background:var(--jade)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--ink-3);font-weight:400;font-size:12px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.fine{font-size:12px;color:var(--ink-3);line-height:1.7}
/* 结局面板。注意配色类必须带 tone- 前缀 —— 直接叫 .seal 会撞上顶栏印章
   （.seal 有 width:30px;color:#fff），断语会变成白字压红块、根本看不见 */
.over .verdict{font-family:var(--font);font-size:16px;line-height:1.8;padding:12px 14px;border-radius:10px;
  color:var(--ink);background:var(--paper-3);border-left:3px solid var(--seal);margin:12px 0 14px}
.over .verdict.tone-jade{border-left-color:var(--jade);background:var(--jade-soft)}
.over .verdict.tone-gold{border-left-color:var(--gold);background:var(--gold-soft)}
.over .verdict.tone-slate{border-left-color:var(--slate);background:var(--slate-soft)}
.over .sec{font-size:13px;color:var(--ink-3);letter-spacing:.1em;margin:16px 0 6px;font-weight:500}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv span:last-child{color:var(--ink-2)}
/* ── 开局封面 ── */
.splash{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  padding:28px 20px;overflow-y:auto;
  background:
    radial-gradient(1100px 460px at 50% -8%, #fffdf8 0%, transparent 62%),
    repeating-linear-gradient(0deg, transparent 0 27px, rgba(140,120,90,.045) 27px 28px),
    var(--paper);
  animation:fade .3s ease}
@keyframes fade{from{opacity:0}}
.splash-in{width:min(520px,100%);animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

.hero{text-align:center;margin-bottom:24px}
.hero-seal{width:52px;height:52px;margin:0 auto 15px;display:grid;place-items:center;
  background:var(--seal);color:#fff;font-family:var(--font);font-size:27px;border-radius:10px;
  box-shadow:0 4px 14px rgba(156,43,43,.24)}
.hero-title{font-family:var(--font);font-size:36px;font-weight:500;letter-spacing:.34em;
  margin:0 0 12px;text-indent:.34em;color:var(--ink)}
/* 细分隔线两端缀朱点，替掉一条光秃秃的横线 */
.hero-rule{position:relative;width:76px;height:1px;margin:0 auto 13px;background:var(--line-2)}
.hero-rule::before,.hero-rule::after{content:'';position:absolute;top:50%;width:4px;height:4px;
  border-radius:50%;background:var(--seal);transform:translateY(-50%)}
.hero-rule::before{left:-10px}
.hero-rule::after{right:-10px}
.hero-sub{margin:0;color:var(--ink-3);font-size:12.5px;letter-spacing:.2em}

.startcard{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;
  padding:24px 24px 18px;box-shadow:var(--shadow-md)}

.field{margin-bottom:17px;text-align:left}
.field label{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--ink-2);margin-bottom:7px}
.field label .hint{font-size:11.5px;color:var(--ink-3);letter-spacing:0}
.field input{width:100%;padding:11px 13px;font-size:15px}

/* 出身卡：把五个选项的差别直接摆出来，不用猜 */
.origins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.origin{position:relative;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;
  cursor:pointer;background:var(--paper-2);transition:.16s}
.origin:hover{border-color:var(--gold);background:var(--gold-soft)}
.origin.on{border-color:var(--seal);background:var(--seal-soft);box-shadow:inset 3px 0 0 var(--seal)}
/* 选中角标：光靠底色深浅不够明确 */
.origin.on::after{content:'';position:absolute;top:9px;right:9px;width:6px;height:6px;
  border-radius:50%;background:var(--seal)}
.origin.on .nm{color:var(--seal)}
.origin .nm{font-family:var(--font);font-size:14px;font-weight:600;letter-spacing:.06em}
.origin .ds{font-size:11.5px;color:var(--ink-3);line-height:1.5;margin-top:3px}
.origin .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.origin .st i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:20px;
  background:var(--paper-3);color:var(--ink-2);border:1px solid var(--line)}
.origin.on .st i{background:#fff;border-color:#e6c9c6;color:var(--seal)}

.btn.lg{padding:13px;font-size:15px;letter-spacing:.22em}
.splash .fine{margin:14px 0 0;text-align:center}
#sp-continue{margin-bottom:9px;letter-spacing:.14em}

/* ══════════ 响应式：手机（≤720px） ══════════ */
@media (max-width:720px){
  .wrap{padding:0 12px calc(32px + env(safe-area-inset-bottom))}
  .top{padding-top:calc(8px + env(safe-area-inset-top))}

  /* 顶栏改为两行：品牌 + 按钮，资源条横滑独占一行 */
  .top-in{gap:8px}
  .brand{font-size:17px;letter-spacing:1px}
  .brand-seal{width:26px;height:26px;font-size:15px}
  /* 资源条整行换行显示，不留横向裁切 */
  .strip{order:3;width:100%;margin-left:0;gap:8px 14px;flex-wrap:wrap;row-gap:4px}
  .top-in>div:last-child{margin-left:auto;gap:6px}
  .lb-full{display:none}
  .lb-mini{display:inline}

  /* 触摸目标不小于 40px 高 */
  .btn{padding:9px 14px}
  .btn.sm{padding:8px 12px}
  .tab{padding:9px 13px}
  .tabs{overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
  .tabs::-webkit-scrollbar{display:none}

  /* 单列：先游戏主体，再案头事件，最后属性面板
     必须显式 stretch —— 桌面规则里的 align-items:start 会让单列子项收缩成内容宽 */
  .grid{display:flex;flex-direction:column;gap:12px;margin-top:12px;align-items:stretch}
  .main{order:1;width:100%}
  .rail{order:2;width:100%}
  .side{order:3;width:100%}
  .card{padding:12px;border-radius:9px;margin-bottom:12px}

  /* 行动卡：消耗另起一行，按钮通栏更好点 */
  .act{padding:11px}
  .act-h{flex-wrap:wrap;row-gap:2px}
  .act-h .cost{margin-left:0;order:2;width:100%}
  .act .btn.sm{width:100%;text-align:center}

  /* 列表与名册改为整页滚动，不做内嵌滚动区 */
  .list{max-height:none;overflow:visible}
  .row{flex-wrap:wrap;row-gap:4px;padding:9px 8px}
  .row .rt{margin-left:0;width:100%}

  /* 官阶表：压紧到能整表放下，实在放不下才横向滑动 */
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tw table{min-width:0}
  th,td{padding:5px 4px}
  table{font-size:12px}

  /* 弹层贴底，像原生抽屉 */
  .mask{padding:0;align-items:flex-end}
  .modal{width:100%;max-height:90vh;border-radius:14px 14px 0 0}
  .modal-h{padding:13px 15px}
  .modal-b{padding:14px 15px}
  .modal-f{padding:10px 15px calc(12px + env(safe-area-inset-bottom))}
  .modal-f .btn{padding:10px 16px}
  .opt{padding:12px}

  /* 提示条贴底通栏，避免遮挡卡片按钮 */
  .toasts{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));align-items:stretch}
  .toast{max-width:none}

  .gaz{font-size:12.5px}

  /* 封面：手机上收字号、出身改单列 */
  .splash{padding:16px 14px}
  .hero{margin-bottom:15px}
  .hero-seal{width:42px;height:42px;font-size:22px;margin-bottom:10px}
  .hero-title{font-size:27px;letter-spacing:.24em;text-indent:.24em;margin-bottom:10px}
  .hero-sub{font-size:12px;letter-spacing:.14em}
  .startcard{padding:16px 15px 12px;border-radius:14px}
  .field{margin-bottom:14px}
  .btn.lg{padding:12px}
  /* 出身卡两列、藏起氛围描述 —— 否则封面高到要滚动才能看到「释褐入仕」 */
  .origins{grid-template-columns:1fr 1fr;gap:7px}
  .origin{padding:9px 10px}
  .origin .ds{display:none}
  .origin:last-child{grid-column:1/-1}
  .origin .st{margin-top:6px}
}

/* 超窄屏（≤380px）再收一档字号与内距 */
@media (max-width:380px){
  .brand{font-size:15px}
  .brand-seal{width:22px;height:22px;font-size:13px}
  .tab{padding:8px 10px;font-size:13px}
  .btn.sm{padding:7px 10px;font-size:12.5px}
  .act .act-h{font-size:14px}
}

/* 手机横放（矮屏）：弹层别占满高度 */
@media (max-height:520px) and (orientation:landscape){
  .modal{max-height:94vh}
  .splash{padding:14px 16px}
  .hero{margin-bottom:12px}
  .hero-seal{width:38px;height:38px;font-size:20px;margin-bottom:8px}
  .hero-title{font-size:22px;margin-bottom:8px;letter-spacing:.2em;text-indent:.2em}
  .origins{grid-template-columns:1fr 1fr 1fr}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap top-in">
    <div class="brand"><span class="brand-seal">衍</span>大衍帝国</div>
    <div class="strip" id="strip"></div>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="btn-tick"><span class="lb-full">推 进 一 回 合</span><span class="lb-mini">推 进</span></button>
      <button class="btn sm" id="btn-menu">档</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="grid">
    <div class="side">
      <div class="card" id="card-me"></div>
      <div class="card" id="card-stats"></div>
    </div>
    <div class="main">
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
    </div>
    <div class="rail">
      <div class="card" id="card-event"></div>
      <div class="card" id="card-gaz"></div>
    </div>
  </div>
</div>

<div class="mask" id="mask"><div class="modal">
  <div class="modal-h"><span id="m-title"></span><button class="x" id="m-x">×</button></div>
  <div class="modal-b" id="m-body"></div>
  <div class="modal-f" id="m-foot"></div>
</div></div>

<div class="toasts" id="toasts"></div>
<div class="splash" id="splash"><div class="splash-in">

  <div class="hero">
    <div class="hero-seal">衍</div>
    <h1 class="hero-title">大衍帝国</h1>
    <div class="hero-rule"></div>
    <p class="hero-sub">单机版 · 十八级官阶 · 五十四缺待补</p>
  </div>

  <div class="startcard">
    <div class="field">
      <label>表字<span class="hint">同僚如何称呼你</span></label>
      <input id="sp-name" maxlength="8" placeholder="如：沈砚" autocomplete="off" />
    </div>

    <div class="field">
      <label>出身<span class="hint">决定起手的资历与人情</span></label>
      <div class="origins" id="sp-origins"></div>

  {key:'scheme',path:'shadow',name:'密谋构陷',desc:'设一个局，让对手在考成或圣眷上栽一跤。',cost:{},cd:1,target:1,

let S = null;
const SAVE_KEY = 'daiyan.offline.v1';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const $ =id=>document.getElementById(id);

function blankStats(){ return {merit:0,renown:0,guile:0,network:0,favor:0,exposure:0,health:100}; }

function rel(from,to,type){ if(!S) return null; return S.rels.find(r=>r.from===from&&r.to===to&&r.type===type)||null; }
function apRel(from,to,type,d){
  if(from===to) return;
  let r = rel(from,to,type);
  if(r){ r.s=clamp(r.s+d,0,100); if(r.s===0) S.rels=S.rels.filter(x=>x!==r); }
  else if(d>0){ S.rels.push({from,to,type,s:clamp(d,0,100)}); }
}
function patronsOf(id){ return S.rels.filter(r=>r.to===id&&r.type==='patron').map(r=>byId(r.from)).filter(Boolean); }
function byId(id){ if(id===0) return S.me; return S.npcs.find(n=>n.id===id)||null; }
function scoreOf(st){ return st.merit+st.renown*0.6+st.network*0.8+st.favor*1.2; }
function powerOf(p){
  const st=p.stats, r=p.res;
  return Math.round(st.merit+st.renown*0.8+st.network*1.2+st.favor*1.5+st.guile*0.9+r.silver/50+p.rank*120);
}
function doctrineOf(p){ if(!p.faction) return null; const f=S.factions.find(x=>x.id===p.faction); return f?DOCTRINES[f.doctrine]:null; }

/**
 * 银两口径：以县令（俸禄 40）为基准 1.0。
 * 俸禄随官阶涨近千倍，若打点开价固定，同一份礼在末吏是半年俸禄、在首辅则不值一提 ——
 * 于是低阶暗线被锁死、高阶暗线零成本。换算后「一次打点值几回合俸禄」在各阶大致相同。
 */
function silverScale(rankId){ return Math.max(1,RANK[rankId].salary)/40; }
function sCost(v,rankId){ return Math.max(1,Math.round(v*silverScale(rankId))); }
/** 某行动当前官阶下的实际银两开销 */
function silverNeedOf(a,rankId){ return a.cost&&a.cost.silver?sCost(a.cost.silver,rankId):0; }

/** 属性变动：受所属党派宗旨乘数影响（增益类），并统一钳制 */
function apply(p,eff,mul){
  const d = doctrineOf(p), m = mul===undefined?1:mul;
  const out=[];
  for(const k in eff){
    let v = eff[k]*m;
    if(k==='silver'){ p.res.silver=Math.max(0,Math.round(p.res.silver+v)); out.push(['银两',v]); continue; }
    if(k==='mandate'){ p.res.mandate=clamp(Math.round(p.res.mandate+v),0,999); out.push(['政令',v]); continue; }
    if(k==='health'){ p.stats.health=clamp(Math.round(p.stats.health+v),0,100); out.push(['精力',v]); continue; }
    if(!(k in p.stats)) continue;
    let f=1;
    if(d && d.m[k]) f=d.m[k];
    if(k==='exposure'){ v=Math.max(0,v*f); p.stats.exposure=clamp(Math.round(p.stats.exposure+v),0,CONST.MAX_EXPOSURE); }
    else { v=v*f; p.stats[k]=Math.max(0,Math.round(p.stats[k]+v)); }
    out.push([STAT_NAME[k]||k,v]);
  }
  return out;
}
const STAT_NAME={merit:'政绩',renown:'声望',guile:'权谋',network:'人脉',favor:'圣眷',exposure:'暴露',health:'精力'};

/* ── 占缺 ── */
function buildSlots(){
  S.slots=[];
  for(let id=CONST.CONTESTED_FROM;id<=MAX_RANK;id++){
    const n=RANK[id].slots;
    for(const og of organKeys(id)) for(let i=0;i<n;i++) S.slots.push({rank:id,organ:og,idx:i,holder:null});
  }
}
function slotStats(rankId){
  // 基层（slots 为 null）不限员额，不建占缺记录
  if(RANK[rankId].slots===null) return {total:null, filled:0};
  const all=S.slots.filter(s=>s.rank===rankId);
  return {total:all.length, filled:all.filter(s=>s.holder!==null).length};
}
function takeSlot(p,rankId){
  const free=S.slots.filter(s=>s.rank===rankId&&s.holder===null);
  if(!free.length) return null;
  const want=free.filter(s=>s.organ===RANK[rankId].organ);
  const s = want.length?want[0]:free[0];
  s.holder=p.id; p.organ=s.organ; return s;
}
function releaseSlots(id){ S.slots.forEach(s=>{ if(s.holder===id) s.holder=null; }); }
/** 该阶上权势最弱的朝臣（供玩家挤缺） */
function weakestAt(rankId){
  const ids=S.slots.filter(s=>s.rank===rankId&&s.holder!==null&&s.holder!==0).map(s=>s.holder);
  const ps=ids.map(byId).filter(p=>p&&!p.retired);
  if(!ps.length) return null;
  return ps.reduce((a,b)=>powerOf(b)<powerOf(a)?b:a);
}

/* ── 朝臣建制 ── */
const COURT_PLAN={17:1,16:1,15:3,14:4,13:1,12:1,11:4,10:6,9:6,8:1,7:1,6:1,5:1,4:1};
const JUNIOR_PLAN={0:7,1:6,2:6,3:5};

function mkName(used){
  for(let i=0;i<200;i++){ const n=pick(SURNAMES)+pick(GIVEN); if(!used.has(n)){ used.add(n); return n; } }
  return pick(SURNAMES)+'某';
}
function mkStats(rankId){
  const cap=RANK[rankId].cap, f=(x)=>Math.max(0,Math.round(cap*x*rnd(0.7,1.3)));
  return {merit:f(0.30),renown:f(0.22),guile:f(0.20),network:f(0.26),favor:f(0.24),exposure:ri(0,22),health:100};
}
function seedCourt(){
  const used=new Set([S.me.name]); let id=1;
  S.factions=FACTION_PLAN.map((f,i)=>({id:i+1,name:f.name,doctrine:f.doctrine,motto:f.motto,leader:null,treasury:ri(200,900),power:0}));
  S.npcs=[];
  const plan=[];
  for(const k in COURT_PLAN) for(let i=0;i<COURT_PLAN[k];i++) plan.push(Number(k));
  for(const k in JUNIOR_PLAN) for(let i=0;i<JUNIOR_PLAN[k];i++) plan.push(Number(k));
  plan.sort((a,b)=>b-a);
  // 四党在各阶都要有人：按官阶分层轮转，高位再随机微调
  plan.forEach((rankId,i)=>{
    const p={id:id++,name:mkName(used),rank:rankId,organ:null,faction:(i%4)+1,
      stats:mkStats(rankId),res:{silver:RANK[rankId].salary*ri(2,8),mandate:RANK[rankId].mandate,influence:0},
      tenure:ri(1,40),retired:false,isNpc:true};
    S.npcs.push(p);
    if(rankId>=CONST.CONTESTED_FROM) takeSlot(p,rankId);
    else p.organ=RANK[rankId].organ;
  });
  // 党魁：党内官阶最高者
  S.factions.forEach(f=>{
    const mem=S.npcs.filter(n=>n.faction===f.id&&!n.retired).sort((a,b)=>b.rank-a.rank);
    if(mem.length){ f.leader=mem[0].id; mem.slice(1,7).forEach(m=>{ apRel(f.leader,m.id,'protege',ri(35,70)); apRel(m.id,f.leader,'patron',ri(35,70)); }); }
  });
  // 四党党魁两两互为政敌
  const ls=S.factions.map(f=>f.leader).filter(Boolean);
  for(let i=0;i<ls.length;i++) for(let j=i+1;j<ls.length;j++){ apRel(ls[i],ls[j],'rival',40); apRel(ls[j],ls[i],'rival',40); }
}

function freshState(name,originKey){
  const o=ORIGINS.find(x=>x.key===originKey)||ORIGINS[0];
  const st=blankStats(); for(const k in o.st) st[k]=Math.max(0,o.st[k]);
  S={v:1,tick:0,origin:o.key,
    me:{id:0,name:name||'沈砚',rank:0,organ:'county',tenure:0,stats:st,
      res:{silver:CONST.START_SILVER+o.res.silver,mandate:RANK[0].mandate,influence:0},
      cd:{},faction:null,careerPeak:0,impeachCount:0,retired:false,isNpc:false},
    npcs:[],factions:[],rels:[],slots:[],gaz:[],pending:[],peak:0,auto:false};
  for(const k in o.st){} // 出身已计入
  buildSlots(); seedCourt(); gaz('system','大衍承平，朝廷开科取士，四方士子释褐入仕。');
  return S;
}
function save(slot){
  try{
    const key=slot?SAVE_KEY+'.'+slot:SAVE_KEY;
    localStorage.setItem(key,JSON.stringify(S));
    return true;
  }catch(e){ toast('存档失败：'+e.message,'bad'); return false; }
}
function load(slot){
  try{
    const key=slot?SAVE_KEY+'.'+slot:SAVE_KEY;
    const raw=localStorage.getItem(key); if(!raw) return null;
    const o=JSON.parse(raw); if(!o||!o.me) return null;
    S=o; migrate(); return S;
  }catch(e){ return null; }
}
function migrate(){
  S.v=1; S.npcs=S.npcs||[]; S.rels=S.rels||[]; S.factions=S.factions||[]; S.gaz=S.gaz||[];
  S.pending=S.pending||[]; S.slots=S.slots||[]; S.me.cd=S.me.cd||{};
  if(typeof S.me.retired!=='boolean') S.me.retired=false;
  if(!S.me.stats.health) S.me.stats.health=100;
  if(!S.peak) S.peak=S.me.careerPeak||0;
}
/** mine=1 标记「与我直接相关」，结局的生平大事只取这些，免得被朝臣迁转刷屏 */
function gaz(kind,text,priv,mine){ S.gaz.unshift({kind,text,tick:S.tick,priv:!!priv,mine:!!mine}); if(S.gaz.length>240) S.gaz.length=240; }
/* ══════════ 三、玩法核心 ══════════ */

function toast(msg,kind){
  const el=document.createElement('div');
  el.className='toast'+(kind?' '+kind:'');
  el.textContent=msg;
  const box=$('toasts');
  box.appendChild(el);
  // 连点推进时别把屏幕堆满提示条
  while(box.children.length>3) box.removeChild(box.firstChild);
  setTimeout(()=>{ el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2600);
}

/* ── 执行行动 ── */
function doAct(key,targetId){
  const a=ACT[key]; if(!a) return {err:'无此行事。'};
  const me=S.me;
  if(S.over) return {err:'这一局已经收场了。'};
  if(me.retired) return {err:'你已不在朝中。'};
  if((me.cd[key]||0)>S.tick) return {err:'此事宜缓，须待下回合再议。'};
  const t=targetId!=null?byId(targetId):null;
  const C={p:me,st:me.stats,res:me.res,t:t};
  if(a.req){ const e=a.req(C); if(e) return {err:e}; }
  const cost=a.cost||{};
  const silverNeed=silverNeedOf(a,me.rank);
  if(cost.mandate&&me.res.mandate<cost.mandate) return {err:'政令不足，难以措手。'};
  if(silverNeed&&me.res.silver<silverNeed) return {err:`银两不足（需 ${silverNeed} 两）。`};
  const r=a.run(C)||{};
  if(r.guile&&me.stats.guile<r.guile) return {err:'权谋不足，仓促行事只会露出破绽。'};

  if(cost.mandate) me.res.mandate-=cost.mandate;
  if(silverNeed) me.res.silver=Math.max(0,me.res.silver-silverNeed);
  if(r.guile) me.stats.guile=Math.max(0,me.stats.guile-r.guile);
  if(r.grease) me.grease=(me.grease||0)+r.grease;

  const changes=apply(me,moodEff(r.eff||{}));
  if(t){ apply(t,r.teff||{}); (r.rel||[]).forEach(([to,type,d])=>{ apRel(me.id,to,type,d); if(type==='protege') apRel(to,me.id,'patron',d); if(type==='patron') apRel(to,me.id,'protege',d); if(type==='kin') apRel(to,me.id,'kin',d); }); }
  if(a.cd) me.cd[key]=S.tick+a.cd;

  let retaliation=null;
  if(t&&t.isNpc&&['scheme','blackmail','slander','poach'].includes(key)&&!t.retired){
    retaliation=npcRetaliate(t,me);
  }
  if(a.path==='shadow') gaz('rumor','【风闻】京师近日颇有异动，然查无实据。');
  if(r.log) gaz('act',r.log,0,1);

  let imp=null;
  if(!r.retire&&Math.random()<impeachRisk(me.stats.exposure)) imp=doImpeach(me);
  trackPeaks();
  checkFail();
  if(r.retire) endGame('retire');

  save();
  return {log:r.log,changes,retaliation,imp,over:S.over||null};
}

/** 朝臣反制：你动了他，他若权势足够便反手一击 */
function npcRetaliate(n,me){
  if(powerOf(n)<powerOf(me)*0.8 && Math.random()<0.5) return null;
  const k=RANK_YIELD[n.rank];
  const bite={merit:-Math.round(J(14)*k),favor:-Math.round(J(10)*k),exposure:J(6,0.4)};
  apply(me,bite);
  apRel(n.id,me.id,'rival',25); apRel(me.id,n.id,'rival',15);
  const txt=`${n.name} 反手一击：你的考成被驳，上头也淡了几分颜色。`;
  gaz('act',txt);
  return txt;
}

/* ── 铨选 ── */
function readiness(){
  const me=S.me;
  if(me.retired) return {ready:false,reason:'你已不在朝中。'};
  if(me.rank>=MAX_RANK) return {ready:false,reason:'已位极人臣，无可复加。'};
  if((me.cd.__promo||0)>S.tick) return {ready:false,reason:`铨选方毕，须待第 ${me.cd.__promo+1} 回合。`};
  if(me.tenure<3) return {ready:false,reason:`在任未满三回合（今 ${me.tenure}），资历尚浅。`};
  const next=RANK[me.rank+1], sc=scoreOf(me.stats);
  if(sc<next.cap) return {ready:false,reason:`功绩未足：今 ${Math.round(sc)} / 需 ${next.cap}`,score:sc,cap:next.cap};
  const ss=slotStats(me.rank+1);
  // slots 为 null 的基层官阶不限员额，不参与占缺判定
  if(ss.total!==null&&ss.filled>=ss.total){
    if(weakestAt(me.rank+1)) return {ready:true,evict:1,score:sc,cap:next.cap,next};
    return {ready:false,reason:`${next.title}已无缺可补，须待有人去位。`,score:sc,cap:next.cap};
  }
  return {ready:true,score:sc,cap:next.cap,next};
}
function doPromote(){
  const me=S.me, ck=readiness();
  if(!ck.ready) return {err:ck.reason};
  const next=RANK[me.rank+1], sc=scoreOf(me.stats);
  let p=0.35+((sc-next.cap)/Math.max(next.cap,1))*0.55+me.stats.favor/400+me.stats.renown/900-me.stats.exposure/1400;
  const grease=me.grease||0;          // 打点铨曹换来的临时成算
  p+=grease;
  p=clamp(p,0.05,0.95);
  me.cd.__promo=S.tick+CONST.PROMO_CD;
  me.grease=0;                        // 礼送出去了，用不用得上看这一次
  if(Math.random()>=p){
    apply(me,{favor:-4,renown:-3},RANK_YIELD[me.rank]);
    gaz('rumor',`${me.name} 铨选 ${next.title} 未果，仍留原任。`,0,1);
    save(); return {ok:false,msg:`铨选未果（成算 ${Math.round(p*100)}%）${grease?'，打点的银子白花了':''}，仍留原任。`};
  }
  if(ck.evict){
    const victim=weakestAt(me.rank+1);
    if(victim){ retire(victim,`${me.name} 谋得其缺。`); }
  }
  releaseSlots(me.id);
  me.rank=next.id; me.tenure=0; me.careerPeak=Math.max(me.careerPeak,me.rank);
  takeSlot(me,me.rank);
  S.peak=Math.max(S.peak||0,me.rank);
  gaz('promote',`制曰：${me.name} 铨选得中，迁 ${next.grade}${next.title}。`,0,1);
  if(me.rank>=MAX_RANK&&!S.zenith){
    S.zenith=true;
    gaz('system','你已位极人臣 —— 票拟之首。此后可继续经营朝局，也可告病致仕，作一次生平总评。',0,1);
  }
  save();
  return {ok:true,msg:`铨选得中（成算 ${Math.round(p*100)}%${grease?'，含打点加成':''}）。今为 ${next.grade}${next.title}。`};
}

/* ── 弹劾 ── */
function impeachRisk(ex){
  const over=(ex||0)-CONST.IMPEACH_WARN; if(over<=0) return 0;
  return Math.min(1,over/(CONST.MAX_EXPOSURE-CONST.IMPEACH_WARN))*CONST.IMPEACH_RATE;
}
function doImpeach(p){
  const scale=70*RANK_YIELD[p.rank];
  const survive=Math.random()<clamp(p.stats.favor/(p.stats.favor+scale)+0.18,0.12,0.8);
  if(survive){
    apply(p,{exposure:-55,favor:-35,renown:-10},RANK_YIELD[p.rank]);
    gaz('impeach',`台谏交章论 ${p.name}，上命「留中再议」。风波暂息。`,0,p.id===0);
    if(p.id===0) return {survived:1,msg:'弹章盈尺，然圣眷未衰。你安然过关，只是元气大伤。'};
    return {survived:1};
  }
  const old=RANK[p.rank];
  releaseSlots(p.id);
  p.rank=Math.max(0,p.rank-1); p.tenure=0;
  p.stats.exposure=45; p.stats.favor=Math.round(p.stats.favor*0.4);
  if(p.id===0){ p.careerPeak=Math.max(p.careerPeak,p.rank); p.impeachCount++; }
  if(p.rank>=CONST.CONTESTED_FROM) takeSlot(p,p.rank);
  gaz('impeach',`制曰：${p.name} 坐事镌级，降 ${RANK[p.rank].grade}${RANK[p.rank].title}。`,0,p.id===0);
  if(p.id===0){
    // 连坐：姻亲与心腹
    let n=0;
    S.rels.filter(r=>r.from===0&&r.type==='kin').forEach(r=>{ const k=byId(r.to); if(k&&!k.retired){ apply(k,{favor:-14,renown:-6},RANK_YIELD[k.rank]); apRel(0,k.id,'kin',-10); n++; } });
    S.rels.filter(r=>r.to===0&&r.type==='confidant').forEach(r=>{ const k=byId(r.from); if(k&&!k.retired){ apply(k,{favor:-6,network:-5}); n++; } });
    if(n) gaz('impeach',`${p.name} 既败，姻党与门下皆受波及，朝中一时人人自危。`,0,1);
    checkFail();
    return {survived:0,msg:`弹章入，上震怒。你从 ${old.grade}${old.title} 上被拽了下来。`+(n?`（${n} 家受牵连）`:'')};
  }
  return {survived:0};
}
function retire(p,note){
  releaseSlots(p.id); p.retired=true; p.faction=null;
  gaz('retire',`${p.name} 去位。${note||''}`);
}

/* ── 回合推进 ── */
function worldTick(){
  if(S.over) return S.tick;   // 已经收场，朝局不再推进
  S.tick++;
  const me=S.me, r=RANK[me.rank];
  me.res.silver+=r.salary;
  if(me.estates){
    // 田庄岁入 —— 你叫置产，御史的折子里叫兼并。
    // 风声取每处 0.5/回合：要能顶得住一部分自然消退，否则这代价形同虚设
    me.res.silver+=me.estates*Math.round(r.salary*0.15);
    me.stats.exposure=clamp(me.stats.exposure+me.estates*0.5,0,CONST.MAX_EXPOSURE);
  }
  me.res.mandate=r.mandate;
  me.stats.health=clamp(me.stats.health+CONST.HEALTH_REGEN,0,100);
  me.stats.exposure=clamp(me.stats.exposure-CONST.EXPOSURE_DECAY,0,CONST.MAX_EXPOSURE);
  const ero=Math.round(me.stats.exposure*CONST.EXPOSURE_EROSION*RANK_YIELD[me.rank]);
  if(ero) me.stats.favor=Math.max(0,me.stats.favor-ero);
  me.tenure++;
  // 圣心翻转：不提前预告，只有邸报里的一阵风声
  const span=S.moodFast?ri(5,9):ri(10,18);
  if(!S.mood) S.mood={type:pick(['shiwu','qingliu']),until:S.tick+span};
  else if(S.tick>=S.mood.until){
    S.mood={type:S.mood.type==='shiwu'?'qingliu':'shiwu',until:S.tick+span};
    gaz('rumor',`【风闻】上心似有转移，近来${MOODS[S.mood.type].name}之说渐盛。`,0,1);
  }
  if(S.tick%CONST.JINGCHA===0) jingcha();
  else if(S.tick%CONST.DEBATE===0) spawnDebate();
  maybeBigCase();
  if(Math.random()<0.1&&me.stats.health>20) spawnEvent();

  npcTick();
  npcSocial();
  factionTick();
  S.factions.forEach(f=>{
    const mem=[...S.npcs.filter(n=>n.faction===f.id&&!n.retired),...(me.faction===f.id?[me]:[])];
    f.power=mem.reduce((a,m)=>a+powerOf(m),0);
  });
  replenish();
  trackPeaks();
  checkFail();
  save();
  return S.tick;
}

function npcTick(){
  for(const n of S.npcs){
    if(n.retired) continue;
    const r=RANK[n.rank], g=r.cap*0.012*rnd(0.7,1.4);
    apply(n,{merit:J(g),renown:J(g*0.6),network:J(g*0.7),favor:J(g*0.6),guile:J(g*0.8)});
    n.res.silver+=r.salary; n.res.mandate=r.mandate;
    n.stats.exposure=clamp(n.stats.exposure-CONST.EXPOSURE_DECAY,0,CONST.MAX_EXPOSURE);
    n.tenure++;
    if(Math.random()<0.0035){ n.stats.exposure=clamp(n.stats.exposure+rnd(35,70),0,CONST.MAX_EXPOSURE); }
    if(Math.random()<impeachRisk(n.stats.exposure)) doImpeach(n);
    if(n.retired) continue;
    if(n.rank<MAX_RANK&&n.tenure>=3&&scoreOf(n.stats)>=RANK[n.rank+1].cap&&Math.random()<0.35){
      const ss=slotStats(n.rank+1);
      if(ss.filled<ss.total||weakestAt(n.rank+1)){
        if(ss.filled>=ss.total){ const v=weakestAt(n.rank+1); if(v) retire(v,`${n.name} 谋得其缺。`); }
        releaseSlots(n.id); n.rank++; n.tenure=0; takeSlot(n,n.rank);
        gaz('promote',`邸报：${n.name} 迁 ${RANK[n.rank].grade}${RANK[n.rank].title}。`);
        // 门生出息了是要孝敬的 —— 「擢升亲信」的闭环在这里合拢
        if(S.rels.some(r=>r.from===0&&r.to===n.id&&r.type==='protege')){
          const gift=Math.round(RANK[n.rank].salary*0.8);
          S.me.res.silver+=gift; apRel(n.id,0,'protege',8);
          gaz('social',`${n.name} 既迁 ${RANK[n.rank].title}，孝敬了你 ${gift} 两。门生的出息，就是座主的臂膀。`,0,1);
        }
      }
    }
    if(Math.random()<(n.rank>=CONTESTED_FROM?0.004:0.002)||n.tenure>420){ retire(n,'年资已深，乞休归里。'); }
  }
}

/** 朝臣主动出招：每回合至多一人对玩家出手 */
function npcSocial(){
  const me=S.me; if(me.retired) return null;
  const pool=S.npcs.filter(n=>!n.retired&&n.rank>=4);
  if(!pool.length||Math.random()>Math.min(0.45,0.08+pool.length*0.01)) return null;
  // 优先挑与玩家有往来的人
  const linked=pool.filter(n=>S.rels.some(r=>(r.from===n.id&&r.to===0)||(r.to===n.id&&r.from===0)));
  const n=(linked.length&&Math.random()<0.7)?pick(linked):pick(pool);
  const d=doctrineOf(n), k=RANK_YIELD[n.rank];
  const hasBond=S.rels.some(r=>(r.from===n.id&&r.to===0)&&['patron','protege','ally','confidant'].includes(r.type));
  const hasGrudge=S.rels.some(r=>(r.from===n.id&&r.to===0)&&['rival','nemesis'].includes(r.type));
  const dark=d&&d.m.guile>=1.2;
  const sameFaction=!!(me.faction&&n.faction===me.faction);
  // 同党是实在的护身符：不构陷你，还替你在堂上说话
  if(sameFaction&&!hasGrudge){
    apply(me,{favor:J(8)*k,network:J(8)*k});
    apRel(n.id,me.id,'ally',14); apRel(me.id,n.id,'ally',14);
    const txt=`${n.name} 与你同党，在堂上替你递了一句话。`;
    gaz('social',txt); return txt;
  }
  if(hasBond&&!(dark&&Math.random()<0.2)){
    apply(me,{favor:J(9)*k,renown:J(5)*k});
    apRel(n.id,me.id,'patron',20); apRel(me.id,n.id,'protege',20);
    const txt=`${n.name} 在御前替你说了话。自此他以你为门生。`;
    gaz('social',txt); return txt;
  }
  if(!sameFaction&&(hasGrudge||(dark&&Math.random()<0.5))){
    const hit=powerOf(n)>powerOf(me)*rnd(0.6,1.2);
    if(hit){
      apply(me,{merit:-J(12)*k,favor:-J(6)*k,exposure:J(5,0.4)});
      apRel(n.id,me.id,'rival',20);
      gaz('rumor','【风闻】京师近日颇有异动，然查无实据。');
      gaz('social',`${n.name} 在暗中动了你一手。（私档）`,1);
      return `${n.name} 暗中构陷：`;
    }
    gaz('rumor','【风闻】有人在御前递了折子，语焉不详。');
    return null;
  }
  if(!me.faction&&S.factions.some(f=>f.id===n.faction)){
    apply(me,{network:J(12)*k,favor:J(5)*k});
    gaz('social',`${n.name} 遣人来问：可愿入我 ${S.factions.find(f=>f.id===n.faction).name}？`);
    return `${n.name} 有意招揽。`;
  }
  return null;
}

/* ── 京察：每 24 回合全朝大考核。攒功绩、洗痕迹，都要赶在它之前 ── */
function jingcha(){
  const me=S.me;
  const cap=RANK[me.rank].cap, sc=scoreOf(me.stats);
  let grade;
  if(me.stats.exposure>=78||sc<cap*0.5) grade='劣';
  else if(sc>=cap*1.15) grade='卓异';
  else grade='平常';
  if(grade==='卓异'){
    apply(me,{favor:J(30),renown:J(14)},RANK_YIELD[me.rank]);
    gaz('system',`京察：你考得「卓异」。堂官在考语里写的是「才守兼优」。`,0,1);
  }else if(grade==='劣'){
    if(me.stats.exposure>=78){
      // 以贪墨名镌级 —— 与落马同罚，但不占三次落马的次数（留个体面）
      releaseSlots(me.id);
      me.rank=Math.max(0,me.rank-1); me.tenure=0;
      me.stats.exposure=45; me.stats.favor=Math.round(me.stats.favor*0.6);
      if(me.rank>=CONST.CONTESTED_FROM) takeSlot(me,me.rank);
      S.peak=Math.max(S.peak||0,me.careerPeak=Math.max(me.careerPeak||0,me.rank));
      gaz('system',`京察：你考得「劣」。以贪墨名镌级，降为 ${RANK[me.rank].grade}${RANK[me.rank].title}。`,0,1);
    }else{
      apply(me,{favor:-J(20),renown:-J(10)},RANK_YIELD[me.rank]);
      gaz('system',`京察：你考得「劣」。考语只有四个字：「才力不及」。`,0,1);
    }
  }else{
    gaz('system','京察：你考得「平常」。不上不下，安如磐石。',0,1);
  }
  // 朝臣同受评定：劣者镌级（缺腾出来了），卓异者圣眷加身 —— 朝局每 24 回合大洗一次
  S.npcs.filter(n=>!n.retired).forEach(n=>{
    if(Math.random()>=0.15) return;
    const c=RANK[n.rank].cap, s=scoreOf(n.stats);
    if(s<c*0.4||n.stats.exposure>90){
      if(n.rank>0){ releaseSlots(n.id); n.rank--; if(n.rank>=CONST.CONTESTED_FROM) takeSlot(n,n.rank); n.tenure=0; }
    }else if(s>c*1.2){ n.stats.favor=Math.min(9999,n.stats.favor+30); }
  });
}

/* ── 朝议：每 12 回合一场。不问你选的是不是「对的」，问你站的是不是赢的那边 ── */
function spawnDebate(){
  if(S.pending.some(e=>e.debate)) return;
  const t=pick(DEBATES);
  const pw={qingliu:1,shiwu:1,shoucheng:1,jijin:1};
  S.npcs.filter(n=>!n.retired&&n.faction).forEach(n=>{
    const f=S.factions.find(x=>x.id===n.faction); if(f) pw[f.doctrine]+=powerOf(n);
  });
  if(S.me.faction){ const mf=S.factions.find(x=>x.id===S.me.faction); if(mf) pw[mf.doctrine]+=powerOf(S.me); }
  const pa=pw[t.a.align], pb=pw[t.b.align];
  const pct=Math.round(pa/(pa+pb)*100);
  S.pending.push({debate:1,key:'debate',title:'朝议 · '+t.title,tick:S.tick,odds:{pa,pb,a:t.a.align,b:t.b.align},
    text:t.text,
    opts:[
      {label:t.a.label,desc:t.a.desc+` 附和者党势约 ${pa}，胜面约 ${pct}%。`,cost:{},side:'a'},
      {label:t.b.label,desc:t.b.desc+` 附和者党势约 ${pb}，胜面约 ${100-pct}%。`,cost:{},side:'b'},
      {label:'缄默不语',desc:'不站队，不担责 —— 也分不到站的对的那份功。',cost:{},side:'none'},
    ]});
  gaz('system',`朝议起：「${t.title}」。各方都在递帖子拉人。`,0,1);
}

/* ── 大案要案：跨回合事件链，前面的选择决定后面拿到什么牌 ── */
const BIGCASE={
  river:{
    1:{title:'河工贪案 · 发端',text:'你治下河工银两层层剥蚀，堤成即溃，灾民塞道。此时一份匿名账册送到案头。',
       opts:[
        {label:'按册彻查',desc:'牵连必广，但堤不能再溃了。',cost:{mandate:3},next:2,mark:'investigate'},
        {label:'压下账册',desc:'上头递了话，银子也递了。',cost:{},next:0,mark:'suppress',eff:{silver:400,exposure:16,renown:-10}},
       ]},
    2:{title:'河工贪案 · 顺藤',text:'查下来，河银有四成过了京里两位大员的门。折子怎么递，取决于你想动谁。',
       opts:[
        {label:'密奏御前',desc:'掀开盖子 —— 也把自己放在火上。',cost:{mandate:4},next:3,mark:'imperial'},
        {label:'只办典史顶罪',desc:'拿两个小吏结案，大员们记你懂事。',cost:{mandate:1},next:3,mark:'small'},
       ]},
    3:{title:'河工贪案 · 定谳',text:'钦案将结。你把案卷誊清，在末页附上了自己的名字。',
       opts:[{label:'结案归档',desc:'案卷入库，风波入史。',cost:{},next:0,mark:'done'}]},
  }
};
function pushCaseEvent(n){
  const c=S.case; if(!c) return;
  const st=BIGCASE[c.key][n];
  let opts=st.opts;
  if(n===3){
    // 结局效果取决于第二段的抉择：掀盖子还是只拍苍蝇
    if(c.vars.c2==='imperial'){
      const loyal=S.mood&&S.mood.type==='qingliu';
      opts=[{label:'结案归档',desc:loyal?'圣心正喜直臣 —— 你的名字会进史册。':'上头记下了你这次多嘴。',cost:{},next:0,mark:'done',
        eff:{merit:40,renown:J(30),network:-J(15),exposure:J(8),favor:loyal?J(15):-J(10)}}];
    }else if(c.vars.c2==='small'){
      opts=[{label:'结案归档',desc:'上头觉得你懂事。账面上滴水不漏。',cost:{},next:0,mark:'done',
        eff:{merit:15,network:J(12),renown:-J(10)}}];
    }
  }
  S.pending.push({key:`case_${c.key}_${n}`,caseStage:n,title:st.title,text:st.text,tick:S.tick,opts});
}
function maybeBigCase(){
  if(S.case||S.me.rank<5||S.tick<30) return;
  if(Math.random()<0.06){ S.case={key:'river',stage:1,vars:{}}; pushCaseEvent(1); }
}

/** 党内提携：党中有人比你高，才会替你说话；党势越厚，话越管用 */
function factionTick(){  const me=S.me; if(!me.faction||S.over) return;
  const f=S.factions.find(x=>x.id===me.faction); if(!f) return;
  const mates=S.npcs.filter(n=>n.faction===f.id&&!n.retired);
  if(!mates.length) return;
  const top=mates.reduce((a,b)=>b.rank>a.rank?b:a);
  if(top.rank<=me.rank) return;
  const k=RANK_YIELD[me.rank];
  const w=Math.min(1.5,0.6+(f.power/Math.max(1,powerOf(me)))*0.4);
  apply(me,{favor:Math.round(2*k*w),network:Math.round(3*k*w)});
  if(S.tick%8===0) gaz('faction',`${top.name}（${RANK[top.rank].title}）在堂上替「${f.name}」说了话，你也沾了光。`,0,1);
}

/** 空缺过多时补新血 */
function replenish(){
  const free=S.slots.filter(s=>s.holder===null).length;
  const live=S.npcs.filter(n=>!n.retired).length;
  if(free<10||live>=70) return;
  if(S.scarce&&Math.random()<0.6) return; // 朝局变体「缺额紧张」：出缺寥寥，升迁更挤
  const id=Math.max(0,...S.npcs.map(n=>n.id))+1;
  const used=new Set([...S.npcs.map(n=>n.name),S.me.name]);
  const rank=pick([4,5,6,7,9,10]);
  const n={id,name:mkName(used),rank,organ:null,faction:ri(1,4),stats:mkStats(rank),
    res:{silver:RANK[rank].salary*ri(2,6),mandate:RANK[rank].mandate,influence:0},
    tenure:0,retired:false,isNpc:true};
  takeSlot(n,rank); S.npcs.push(n);
  gaz('system',`新科士子 ${n.name} 释褐，补 ${RANK[rank].title} 之缺。`);
}

/* ── 随机事件 ── */
function spawnEvent(){
  const me=S.me;
  const pool=EVENTS.filter(e=>me.rank>=e.min&&me.rank<=e.max);
  if(!pool.length) return;
  const tot=pool.reduce((a,e)=>a+e.w,0); let x=Math.random()*tot;
  let tpl=pool[pool.length-1];
  for(const e of pool){ x-=e.w; if(x<=0){ tpl=e; break; } }
  S.pending.push({key:tpl.key,title:tpl.title,text:tpl.text,opts:tpl.opts,tick:S.tick});
}
function resolveEvent(i,oi){
  const ev=S.pending[i]; if(!ev) return {err:'无此事件。'};
  const o=ev.opts[oi]; const me=S.me;
  if(S.over) return {err:'这一局已经收场了。'};
  let ch=null, note='';
  if(ev.debate){
    // 朝议胜负按各方党势掷骰 —— 不问你选的是不是「对的」，问你站的是不是赢的那边
    const odds=ev.odds;
    const aWins=Math.random()*(odds.pa+odds.pb)<odds.pa;
    const alignName={qingliu:'清流',shiwu:'实务',shoucheng:'守成',jijin:'激进'};
    if(o.side==='a') ch=apply(me,aWins?{favor:J(18),renown:J(6)}:{favor:-J(14),renown:-J(6)});
    else if(o.side==='b') ch=apply(me,!aWins?{favor:J(18),renown:J(6)}:{favor:-J(14),renown:-J(6)});
    else ch=apply(me,{favor:J(3),merit:J(4)});
    const right=(o.side==='a'&&aWins)||(o.side==='b'&&!aWins);
    note=`朝议已定，「${alignName[aWins?odds.a:odds.b]}」一派占了上风 —— 你${
      o.side==='none'?'袖手旁观':(right?'站对了边':'站错了队')}。`;
  }else{
    const sc=silverScale(me.rank);
    const need=o.cost.silver?Math.round(o.cost.silver*sc):0;
    if(o.cost.mandate&&me.res.mandate<o.cost.mandate) return {err:'政令不足。'};
    if(need&&me.res.silver<need) return {err:`银两不足（需 ${need} 两）。`};
    if(o.cost.mandate) me.res.mandate-=o.cost.mandate;
    if(need) me.res.silver=Math.max(0,me.res.silver-need);
    const eff={...o.eff};
    if(eff.silver) eff.silver=Math.round(eff.silver*sc);
    ch=apply(me,moodEff(eff));
  }
  S.pending.splice(i,1);
  gaz('event',`【${ev.title}】你选择了「${o.label}」。`,0,1);
  if(note) gaz('event',note,0,1);
  // 大案链：记录抉择并推进下一段，末段归档
  if(ev.caseStage&&S.case){
    S.case.vars=Object.assign(S.case.vars||{},{['c'+ev.caseStage]:o.mark});
    if(o.next){ S.case.stage=o.next; pushCaseEvent(o.next); }
    else { S.case=null; gaz('system','河工贪案就此归档。多年后说起那场大水，还有人提起你的名字。',0,1); }
  }
  if(Math.random()<impeachRisk(me.stats.exposure)){ const im=doImpeach(me); save(); return {ch,imp:im}; }
  save();
  return {ch};
}

/* ── 派系 ── */
function createFaction(name,doc){
  const me=S.me;
  if(me.faction) return {err:'你已在党中，不可另立山头。'};
  if(me.stats.network<40) return {err:'人脉不足四十，无人肯附。'};
  if(me.res.silver<300) return {err:'立党须银三百两。'};
  if(!DOCTRINES[doc]) return {err:'宗旨不明。'};
  if(S.factions.some(f=>f.name===name)) return {err:'此党名已有人用。'};
  me.res.silver-=300;
  const id=Math.max(0,...S.factions.map(f=>f.id))+1;
  S.factions.push({id,name,doctrine:doc,motto:DOCTRINES[doc].desc,leader:0,treasury:0,power:0});
  me.faction=id;
  gaz('faction',`${me.name} 立「${name}」一党，宗旨${DOCTRINES[doc].name}。`,0,1);
  save(); return {ok:1};
}
function joinFaction(id){
  const me=S.me; if(me.faction) return {err:'你已在党中。'};
  const f=S.factions.find(x=>x.id===id); if(!f) return {err:'并无此党。'};
  me.faction=id; gaz('faction',`${me.name} 入「${f.name}」。`,0,1); save(); return {ok:1};
}
function leaveFaction(){
  const me=S.me; if(!me.faction) return {err:'你本无党。'};
  const f=S.factions.find(x=>x.id===me.faction);
  me.faction=null; apply(me,{network:-12,renown:-8});
  if(f&&f.leader===0) f.leader=null;
  gaz('faction',`${me.name} 退出「${f?f.name:'某党'}」，清议侧目。`,0,1);
  save(); return {ok:1};
}
function donate(amount){
  const me=S.me; const f=S.factions.find(x=>x.id===me.faction);
  if(!f) return {err:'你尚无党可输。'};
  const v=Math.min(amount,me.res.silver);
  if(v<=0) return {err:'囊中无银。'};
  me.res.silver-=v; f.treasury+=v; me.res.influence+=Math.round(v/50);
  gaz('faction',`${me.name} 输银 ${v} 两入「${f.name}」公库。`,0,1);
  save(); return {ok:1,v};
}

/* ══════════ 终局：三种收场与生平总评 ══════════ */

const END_META={
  retire:{title:'致仕归里',cls:'gold',note:'解印而去，从此不问朝事。'},
  dismiss:{title:'罢黜为民',cls:'seal',note:'三度落马，物议沸腾。有旨：永不叙用。'},
  peak:{title:'位极人臣',cls:'jade',note:'已登首辅，票拟之首。'},
};

function endGame(type,note){
  if(S.over) return S.over;
  S.over={type,note:note||(END_META[type]||{}).note||'',tick:S.tick};
  gaz('end',`【${(END_META[type]||{}).title||'收场'}】${S.over.note}`,0,1);
  // 罪臣子孙不得荫叙 —— 罢黜出局，家底清零
  if(type!=='dismiss'){ try{ localStorage.setItem(LEGACY_KEY,JSON.stringify(buildLegacy())); }catch(e){} }
  save();
  return S.over;
}

/** 生平总评：四个维度各给一档，再合成一句断语 */
function evaluate(){
  const me=S.me;
  const peak=Math.max(S.peak||0,me.rank);
  const clean=(me.peakRenown||0)-(me.impeachCount||0)*10;
  const wealth=me.peakSilver||0;
  const ties=S.rels.filter(r=>r.from===0&&['protege','ally','confidant','patron','kin'].includes(r.type)).length;
  const hasFaction=me.faction?1:0;
  const lv=(v,a,b,c)=>v>=a?3:v>=b?2:v>=c?1:0;
  return {
    peak, clean, wealth, ties, hasFaction,
    rank:lv(peak,15,10,5),
    fame:lv(clean,600,260,60),
    gold:lv(wealth,40000,12000,3000),
    bond:lv(ties+hasFaction,8,5,2),
  };
}
function verdict(){
  const e=evaluate();
  const total=e.rank*2+e.fame+e.gold*0.5+e.bond*0.5;
  let line,tone;
  // 收场方式优先于生平功过：被罢黜的人不该得到一句「进退有据」的评语
  if(S.over&&S.over.type==='dismiss'){
    if(e.gold>=3) return {e,line:'宦囊甚厚而晚节不保。罢黜之日，家产亦入官。',tone:'seal'};
    if(e.rank>=2) return {e,line:'曾历通显，卒以物议去位。仕途之险，于此可见。',tone:'seal'};
    return {e,line:'晚节不保，一败涂地。三度落马，从此不复起用。',tone:'seal'};
  }
  if(e.rank>=3&&e.fame>=2){ line='位极人臣而清名不坠，本朝数十年仅此一人。'; tone='jade'; }
  else if(e.rank>=3&&e.fame<=0){ line='权势倾天下，然身后清议汹汹，子孙不敢言其事。'; tone='seal'; }
  else if(e.rank>=2&&e.fame>=1){ line='历事三朝，进退有据，士林以为得体。'; tone='gold'; }
  else if(e.gold>=3&&e.rank<=1){ line='官未显而家资巨万，时人窃议其所以致此。'; tone='seal'; }
  else if(total>=6){ line='虽未至公卿，然一生无大过，可谓善终。'; tone='jade'; }
  else if(e.rank<=0&&e.fame<=0){ line='碌碌州县，泯然众人，史册不载其名。'; tone='slate'; }
  else { line='宦海浮沉，功过各半，唯自知之。'; tone='gold'; }
  return {e,line,tone};
}

/** 落马满三次即革职 —— 暗线从此有终极代价，不再是无限次降级 */
function checkFail(){
  if(S.over) return;
  if((S.me.impeachCount||0)>=3) endGame('dismiss','三度落马，物议沸腾。有旨：革职为民，永不叙用。');
}

/** 记录生平峰值，供结局总评使用 */
function trackPeaks(){
  const me=S.me;
  S.peak=Math.max(S.peak||0,me.rank);
  me.peakRenown=Math.max(me.peakRenown||0,me.stats.renown);
  me.peakSilver=Math.max(me.peakSilver||0,me.res.silver);
}

/* ══════════ 传承：承先人之荫 ══════════
   罪臣子孙不得荫叙（罢黜出局无传承）；致仕与在位首辅都可以把家底交给儿子 ——
   仇家、故吏、党籍与没洗干净的旧账，一并算在下一代头上 */
const LEGACY_KEY='daiyan_legacy_v1';
function loadLegacy(){ try{ const s=localStorage.getItem(LEGACY_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function legacyRank(l){ return Math.min(5,Math.max(2,Math.floor((l.peak||0)/4))); }

function buildLegacy(){
  const rels=S.rels;
  const nm=(id)=>{ const p=byId(id); return p?p.name:null; };
  return {
    name:S.me.name, peak:S.peak||0,
    silver:Math.round((S.me.peakSilver||0)*0.3),
    renown:S.me.peakRenown||0, clean:evaluate().clean,
    faction:(S.factions.find(f=>f.id===S.me.faction&&f.leader===0)||{}).name||null,
    enemies:rels.filter(r=>r.to===0&&['rival','nemesis'].includes(r.type)).map(r=>nm(r.from)).filter(Boolean),
    patrons:rels.filter(r=>r.to===0&&['patron','ally','confidant'].includes(r.type)).map(r=>nm(r.from)).filter(Boolean),
    proteges:rels.filter(r=>r.from===0&&r.type==='protege').map(r=>nm(r.to)).filter(Boolean),
  };
}

function applyLegacy(st,leg){
  const r0=legacyRank(leg);
  st.me.rank=r0; st.me.tenure=0;
  if(r0>=CONST.CONTESTED_FROM) takeSlot(st.me,r0);
  st.me.res.silver=Math.min(99999,CONST.START_SILVER+Math.round((leg.silver||0)));
  st.me.stats.renown=Math.max(st.me.stats.renown,Math.round((leg.renown||0)*0.4));
  st.me.stats.favor+=Math.max(-10,Math.min(40,Math.round((leg.clean||0)/20)));
  // 父亲留下的具体的人：旧仇与故吏各取前三人，把他们的名字安到本朝的官员头上
  // 注意不能走 apRel —— 仇怨是负增量，而 apRel 只在 d>0 时新建关系，负值会被静默丢弃
  const byRole=(list,type,s)=>{ (list||[]).slice(0,3).forEach((nmm,i)=>{
    const n=st.npcs.filter(x=>!x.retired&&x.rank>=3)[i*3];
    if(n&&nmm){
      n.name=nmm;
      if(!st.rels.some(r=>r.from===n.id&&r.to===0&&r.type===type)) st.rels.push({from:n.id,to:0,type,s:clamp(s,0,100)});
      if(!st.rels.some(r=>r.from===0&&r.to===n.id&&r.type===type)) st.rels.push({from:0,to:n.id,type,s:clamp(s,0,100)});
    }
  });};
  byRole(leg.enemies,'rival',40);
  byRole(leg.patrons,'patron',35);
  byRole(leg.proteges,'ally',30);
  if(leg.faction&&!st.me.faction){
    const old=st.factions.find(f=>f.id===leg.faction) || null;
    // 父亲自创的党在本朝重建
    if(!st.factions.some(f=>f.name===leg.faction)){
      st.factions.push({id:st.factions.length+1,name:leg.faction,doctrine:'qingliu',motto:'承先君之志',leader:0,treasury:0,power:0});
    }
    st.me.faction=st.factions.find(f=>f.name===leg.faction).id;
  }
  st.me.legacyName=leg.name;
  gaz('system',`你是${leg.name}之后。父荫给了你一个${RANK[r0].grade}${RANK[r0].title}的出身${leg.enemies&&leg.enemies.length?'，也给了你他的仇家':''}。`,0,1);
}

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function openModal(title,body,foot){
  $('m-title').textContent=title; $('m-body').innerHTML=body;

  (foot||[{t:'知道了'}]).forEach(b=>{

    el.onclick=()=>{ if(b.fn) b.fn(); else closeModal(); };
    f.appendChild(el);
  });
  $('mask').classList.add('on');
}
function closeModal(){ $('mask').classList.remove('on'); }
$('m-x').onclick=closeModal;
$('mask').addEventListener('click',e=>{ if(e.target.id==='mask') closeModal(); });

function num(v){ return (v>0?'+':'')+Math.round(v*10)/10; }
function fmtChanges(ch){
  if(!ch||!ch.length) return '';
  return ch.map(([k,v])=>`<span class="pill ${v>0?'jade':'seal'}">${k} ${num(v)}</span>`).join(' ');
}

    ${bar('favor','favor')}${bar('exposure','exposure',CONST.MAX_EXPOSURE,st.exposure>=CONST.IMPEACH_WARN)}
    ${bar('health','health',100)}
    ${st.exposure>=CONST.IMPEACH_WARN?`<div class="fine" style="color:var(--seal);margin-top:6px">风声已紧：每次行事后有 ${Math.round(impeachRisk(st.exposure)*100)}% 概率被台谏掀翻。</div>`:''}`;

  $('tabs').innerHTML=[['acts','施 政'],['career','仕 途'],['court','朝 堂'],['faction','党 派'],['gaz','邸 报'],['help','凡 例']]
    .map(([k,n])=>`<button class="tab ${TAB===k?'on':''}" data-t="${k}">${n}</button>`).join('');
  [...document.querySelectorAll('#tabs .tab')].forEach(b=>b.onclick=()=>{ TAB=b.dataset.t; renderAll(); });

  renderView(); renderEvent(); renderGaz();
}

function renderView(){
  const v=$('view');
  // 收场之后，除了翻邸报，其余页签一律让位给结局面板
  if(S.over&&TAB!=='gaz'){ v.innerHTML=renderOver(); bindOver(); return; }
  if(TAB==='acts') v.innerHTML=renderActs();
  else if(TAB==='career') v.innerHTML=renderCareer();
  else if(TAB==='court') v.innerHTML=renderCourt();
  else if(TAB==='faction') v.innerHTML=renderFaction();
  else if(TAB==='gaz') v.innerHTML=renderGazFull();
  else v.innerHTML=renderHelp();
  if(TAB==='acts') bindActs();
  if(TAB==='career') bindCareer();
  if(TAB==='court') bindCourt();
  if(TAB==='faction') bindFaction();
}

/* ── 施政 ── */
function renderActs(){
  const me=S.me;
  let h='';
  for(const pk in PATHS){
    const g=PATHS[pk];
    h+=`<div class="acts-group"><div class="g-title" style="color:${g.color}">${g.name} · ${g.desc}</div>`;
    ACTIONS.filter(a=>a.path===pk).forEach(a=>{
      const cd=(me.cd[a.key]||0)>S.tick;
      const cost=[];
      if(a.cost.mandate) cost.push('政令 '+a.cost.mandate);
      if(a.cost.silver) cost.push('银 '+silverNeedOf(a,me.rank));
      if(a.key==='scheme') cost.push('权谋 '+Math.round(14*RANK_YIELD[me.rank]));
      h+=`<div class="act"><div class="act-h">${a.name}<span class="cost">${cost.join(' · ')||'—'}</span></div>
        <div class="act-d">${a.desc}</div>
        <button class="btn sm ${pk==='open'?'jade':pk==='shadow'?'primary':''}" data-act="${a.key}" ${cd?'disabled':''}>${cd?'尚在冷却':'行 事'}${a.target?' · 择人':''}</button></div>`;
    });
    h+='</div>';
  }
  return h;
}
function bindActs(){
  [...document.querySelectorAll('[data-act]')].forEach(b=>b.onclick=()=>doActUI(b.dataset.act));
}
function doActUI(key){
  const a=ACT[key];
  if(a.target){ pickTarget(a); return; }
  const r=doAct(key,null);
  if(r.err){ toast(r.err,'bad'); return; }
  afterAct(r);
}
function pickTarget(a){
  const me=S.me;
  const rows=[...S.npcs.filter(n=>!n.retired).sort((x,y)=>y.rank-x.rank)];
  const body=`<div class="fine" style="margin-bottom:8px">${a.name} —— 择一人（共 ${rows.length} 员在朝）</div>
    <div class="list">`+rows.map(n=>{
      const rt=[];
      ['patron','protege','ally','confidant','kin','rival','nemesis'].forEach(t=>{
        const rr=rel(0,n.id,t)||rel(n.id,0,t); if(rr) rt.push(`<span class="pill">${REL_NAME[t]} ${rr.s}</span>`);
      });
      return `<div class="row" data-pick="${n.id}"><span class="nm">${esc(n.name)}</span>
        <span class="pill ${RANK[n.rank].id>=12?'seal':RANK[n.rank].id>=8?'gold':'slate'}">${RANK[n.rank].grade}${RANK[n.rank].title}</span>
        ${rt.join('')}<span class="rt">权势 ${powerOf(n)}</span></div>`;
    }).join('')+`</div>`;
  openModal('择一人',body,[{t:'作罢'}]);
  [...document.querySelectorAll('[data-pick]')].forEach(el=>el.onclick=()=>{
    closeModal();
    const r=doAct(a.key,Number(el.dataset.pick));
    if(r.err){ toast(r.err,'bad'); return; }
    afterAct(r);
  });
}
const REL_NAME={patron:'恩主',protege:'门生',ally:'盟友',confidant:'心腹',kin:'姻亲',rival:'政敌',nemesis:'死敌'};

function afterAct(r){
  let h=`<div>${esc(r.log||'事已办妥。')}</div>`;
  if(r.changes&&r.changes.length) h+=`<div style="margin-top:10px">${fmtChanges(r.changes)}</div>`;
  if(r.retaliation) h+=`<div style="margin-top:10px;color:var(--seal)">${esc(r.retaliation)}</div>`;
  if(r.imp) h+=`<div style="margin-top:10px;color:var(--seal)"><b>弹劾</b><br>${esc(r.imp.msg||'朝中有人被参。')}</div>`;
  openModal('行 事',h);
  renderAll();
}

/* ── 朝堂 ── */
/** 朝堂风向：把「谁盯着你」从暗处搬到台面上 —— 看不见的威胁无法被应对 */
function renderWind(){
  const me=S.me;
  const pick=(types)=>{ const set=new Set(types); return S.rels
    .filter(r=>r.from!==0&&r.to===0&&set.has(r.type))
    .map(r=>byId(r.from)).filter(p=>p&&!p.retired)
    .sort((a,b)=>powerOf(b)-powerOf(a)); };
  const foes=pick(['rival','nemesis']);
  const friends=pick(['ally','patron','protege','confidant','kin']);
  const f=me.faction?S.factions.find(x=>x.id===me.faction):null;
  const mates=f?S.npcs.filter(n=>n.faction===f.id&&!n.retired):[];
  const danger=foes.filter(p=>powerOf(p)>=powerOf(me)*0.7);
  const cnt=me.impeachCount||0;
  let h=`<div class="card"><h3>朝堂风向<span class="pill ${danger.length?'seal':'jade'}">${
    danger.length?`有 ${danger.length} 人可能对你出手`:'暂时无人相逼'}</span></h3>`;
  h+=`<div class="kv"><span>痕迹</span><span>${me.stats.exposure>=CONST.IMPEACH_WARN
    ?`已越线 —— 每次行事后 ${Math.round(impeachRisk(me.stats.exposure)*100)}% 遭劾`
    :`未越线（${Math.round(me.stats.exposure)}/${CONST.IMPEACH_WARN}）`}</span></div>`;
  h+=`<div class="kv"><span>落马</span><span>${cnt} / 3 次${cnt>=2?' —— 再有一次便革职为民':''}</span></div>`;
  h+=`<div class="kv"><span>京察</span><span>${CONST.JINGCHA-(S.tick%CONST.JINGCHA)} 回合后大计（功绩 ${Math.round(scoreOf(me.stats))}，过半为安）</span></div>`;
  if(S.mood) h+=`<div class="kv"><span>圣心所在</span><span>喜「${MOODS[S.mood.type].name}」—— ${MOODS[S.mood.type].tip}（约 ${S.mood.until-S.tick} 回合后恐有变）</span></div>`;
  if(f) h+=`<div class="kv"><span>本党</span><span>${esc(f.name)} · 党员 ${mates.length} 人 · 公库 ${f.treasury} 两${
    f.leader===0?'（你是党魁）':''}</span></div>`;
  if(foes.length) h+=`<div class="fine" style="margin-top:9px">结怨：`+
    foes.slice(0,6).map(p=>`<span class="pill ${powerOf(p)>=powerOf(me)*0.7?'seal':''}">${esc(p.name)} ${RANK[p.rank].title}</span>`).join(' ')+`</div>`;
  if(friends.length) h+=`<div class="fine" style="margin-top:6px">交好：`+
    friends.slice(0,6).map(p=>`<span class="pill jade">${esc(p.name)}</span>`).join(' ')+`</div>`;
  h+=`</div>`;
  return h;
}

function renderCourt(){
  const me=S.me;
  const live=S.npcs.filter(n=>!n.retired).sort((a,b)=>b.rank-a.rank);
  const free=S.slots.filter(s=>s.holder===null).length;
  let h=renderWind();
  h+=`<div class="card"><h3>朝堂<span class="pill">在朝 ${live.length} 员 · 空 ${free} 缺</span></h3>
    <div class="fine" style="margin-bottom:8px">点一名朝臣可查看详情并行事；名录按官阶排序。</div>
    <div class="list">`+live.map(n=>{
      const rt=[];
      ['patron','protege','ally','confidant','kin','rival','nemesis'].forEach(t=>{
        const rr=rel(0,n.id,t)||rel(n.id,0,t); if(rr) rt.push(`<span class="pill">${REL_NAME[t]}${rr.s}</span>`);
      });
      const f=S.factions.find(x=>x.id===n.faction);
      return `<div class="row" data-npc="${n.id}"><span class="nm">${esc(n.name)}</span>
        <span class="pill ${n.rank>=12?'seal':n.rank>=8?'gold':'slate'}">${RANK[n.rank].title}</span>
        ${f?`<span class="pill">${esc(f.name)}</span>`:''}${rt.join('')}
        <span class="rt">${ORGANS[n.organ]||''} · 权势 ${powerOf(n)}</span></div>`;
    }).join('')+`</div></div>`;
  const my=[...new Set(S.rels.filter(r=>r.from===0||r.to===0).map(r=>r.from===0?r.to:r.from))].map(byId).filter(Boolean);
  h+=`<div class="card"><h3>我的关系<span class="pill">${my.length} 人</span></h3>`;
  if(!my.length) h+=`<div class="fine">尚无往来。赠礼、修书、举荐、联姻都能结下关系。</div>`;
  my.forEach(p=>{
    const es=S.rels.filter(r=>(r.from===0&&r.to===p.id)||(r.to===0&&r.from===p.id));
    h+=`<div class="kv"><span>${esc(p.name)} · ${RANK[p.rank].title}</span><span>${es.map(r=>`<span class="pill">${REL_NAME[r.type]} ${r.s}</span>`).join(' ')}</span></div>`;
  });
  h+=`</div>`;
  return h;
}
function bindCourt(){
  [...document.querySelectorAll('[data-npc]')].forEach(el=>el.onclick=()=>{
    const n=byId(Number(el.dataset.npc));
    const es=S.rels.filter(r=>(r.from===0&&r.to===n.id)||(r.to===0&&r.from===n.id));

function bindFaction(){

    <b>单机版与联机版的差别</b>：无登录、无聊天、无真人对手，进度存在本机浏览器（localStorage）。
    数值、行动、事件、官阶与联机版同源。<br><br>
    <b>致仕</b>：走投无路时可自请去职，功名人脉恩怨一并归零，从书办重头再来 —— 但官阶巅峰会留在案底。
  </div></div>`;
}

/* ── 待决事件 ── */
function renderEvent(){
  const box=$('card-event');
  if(!S.pending.length){ box.innerHTML=`<h3>案头<span class="pill">无事</span></h3><div class="fine">眼下没有待决之事。</div>`; return; }
  const ev=S.pending[0], me=S.me;
  box.innerHTML=`<h3>${esc(ev.title)}<span class="pill seal">待决 ${S.pending.length}</span></h3>
    <div class="fine" style="margin-bottom:8px">${esc(ev.text)}</div>`+
    ev.opts.map((o,i)=>{
      const sc=silverScale(me.rank);
      const need=o.cost.silver?Math.round(o.cost.silver*sc):0;
      const lack=(o.cost.mandate&&me.res.mandate<o.cost.mandate)||(need&&me.res.silver<need);
      const c=[]; if(o.cost.mandate) c.push('政令 '+o.cost.mandate); if(need) c.push('银 '+need);
      return `<div class="opt ${lack?'dis':''}" data-ev="${i}"><div class="l">${o.label}</div>
        <div class="d">${esc(o.desc)}</div><div class="c">${c.join(' · ')||'无耗费'}</div></div>`;
    }).join('');
  [...box.querySelectorAll('[data-ev]')].forEach(el=>el.onclick=()=>{
    if(el.classList.contains('dis')) return toast('资用不足。','bad');
    const r=resolveEvent(0,Number(el.dataset.ev));
    if(r.err) return toast(r.err,'bad');
    let h=`<div>${esc(ev.opts[Number(el.dataset.ev)].label)} —— 事已定夺。</div>`;
    if(r.ch&&r.ch.length) h+=`<div style="margin-top:10px">${fmtChanges(r.ch)}</div>`;
    if(r.imp) h+=`<div style="margin-top:10px;color:var(--seal)"><b>弹劾</b><br>${esc(r.imp.msg)}</div>`;
    openModal(ev.title,h); renderAll();
  });
}

/* ── 存档菜单 ── */
function openMenu(){
  const slotInfo=[1,2,3].map(i=>{
    let t='空';
    try{ const raw=localStorage.getItem(SAVE_KEY+'.'+i); if(raw){ const o=JSON.parse(raw); t=`${o.me.name} · ${RANK[o.me.rank].title} · 第 ${o.tick} 回合`; } }catch(e){}
    return `<div class="kv"><span>档位 ${i}</span><span>${esc(t)}</span></div>`;
  }).join('');
  openModal('档 案',
    `<div class="fine">进度自动存入浏览器（档位 0）。以下为三个手动档位。</div>
     <div style="margin:10px 0">${slotInfo}</div>
     <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
       ${[1,2,3].map(i=>`<button class="btn sm" data-save="${i}">存入 ${i}</button>`).join('')}
       ${[1,2,3].map(i=>`<button class="btn sm" data-load="${i}">读取 ${i}</button>`).join('')}
     </div>
     <div style="display:flex;flex-wrap:wrap;gap:6px">
       <button class="btn sm" id="m-export">导出存档</button>
       <button class="btn sm" id="m-import">导入存档</button>
       <button class="btn sm" id="m-auto">自动推进：${S.auto?'开':'关'}</button>
       <button class="btn sm" id="m-new">重开一局</button>
     </div>`,[{t:'关闭'}]);
  [...document.querySelectorAll('[data-save]')].forEach(b=>b.onclick=()=>{ save(b.dataset.save); toast('已存入档位 '+b.dataset.save,'good'); closeModal(); openMenu(); });
  [...document.querySelectorAll('[data-load]')].forEach(b=>b.onclick=()=>{
    if(load(b.dataset.load)){ closeModal(); renderAll(); toast('已读取。','good'); } else toast('该档位为空。','bad');
  });
  $('m-export').onclick=()=>{
    const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`daiyan-${S.me.name}-t${S.tick}.json`; a.click();
    toast('已导出。','good');
  };
  $('m-import').onclick=()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
    inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const fr=new FileReader();
      fr.onload=()=>{ try{ const o=JSON.parse(fr.result); if(!o.me) throw 0; S=o; migrate(); save(); closeModal(); renderAll(); toast('已导入。','good'); }catch(e){ toast('存档格式有误。','bad'); } };
      fr.readAsText(f); };
    inp.click();
  };
  $('m-auto').onclick=()=>{ S.auto=!S.auto; save(); closeModal(); openMenu(); setupAuto(); toast('自动推进已'+(S.auto?'开启':'关闭')); };
  $('m-new').onclick=()=>{ if(!confirm('重开一局？当前进度将被覆盖。')) return; localStorage.removeItem(SAVE_KEY); location.reload(); };
}
$('btn-menu').onclick=openMenu;

let autoTimer=null;
function setupAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
  if(S&&S.auto) autoTimer=setInterval(()=>{ worldTick(); renderAll(); },8000);
}

/* ── 推进回合 ── */
$('btn-tick').onclick=()=>{
  const t=worldTick();
  renderAll();
  toast(`第 ${t} 回合 · 朝局已更`);
};

/* ── 启动 ── */
/* ── 随机朝局：每局随机降临一种气象，重开重掷 ── */
const VARIANTS=[
  {key:'young',name:'主少国疑',desc:'上春秋尚幼，母族临朝 —— 圣心翻转更频。'},
  {key:'imbalance',name:'党势失衡',desc:'一党坐大二十年，其余诸党形同虚设。'},
  {key:'scarcity',name:'缺额紧张',desc:'诸部久不迁转，出缺寥寥，铨选愈挤。'},
  {key:'calm',name:'承平日久',desc:'朝局安稳，无风无浪 —— 也无特别的机会。'},
];
function applyVariant(){
  const v=pick(VARIANTS); S.variant=v;
  if(v.key==='young') S.moodFast=true;
  if(v.key==='scarcity') S.scarce=true;
  if(v.key==='imbalance'){
    const f=pick(S.factions);
    S.npcs.filter(n=>n.faction===f.id&&!n.retired).slice(0,3).forEach(n=>{
      if(n.rank<13){ releaseSlots(n.id); n.rank=Math.min(MAX_RANK,n.rank+2); n.stats.merit=RANK[n.rank].cap*0.8;
        if(n.rank>=CONST.CONTESTED_FROM) takeSlot(n,n.rank); }
    });
  }
  gaz('system',`本朝气象：「${v.name}」—— ${v.desc}`,0,1);
}

function startGame(name,origin,legacy){
  freshState(name,origin==='legacy'?'han':origin);
  if(origin==='legacy'&&legacy) applyLegacy(S,legacy);
  applyVariant();
  save(); renderAll(); setupAuto();
  $('splash').classList.add('hidden');
}
let ORIGIN_SEL='han';

function boot(){
  // 出身以卡片呈现：起手加成直接标出来，不必靠一行下拉文案去猜
  // 有先人余荫时，最前面多一张「承先人之荫」
  const leg=loadLegacy();
  const originList=leg?[{key:'legacy',name:'承先人之荫',
    desc:`${leg.name} 之后。父荫与父仇，一并继承。`,
    st:{},res:{silver:Math.min(99999,CONST.START_SILVER+Math.round(leg.silver||0))},
    legacyChips:[`清名 ${Math.round(leg.clean)>=0?'+':''}${Math.round(leg.clean)}`,`起 ${RANK[legacyRank(leg)].title}`]},...ORIGINS]:ORIGINS;
  $('sp-origins').innerHTML=originList.map(o=>{
    const chips=(o.legacyChips?o.legacyChips.map(c=>`<i>${c}</i>`)
      :Object.keys(o.st).map(k=>`<i>${STAT_NAME[k]} ${o.st[k]>0?'+':''}${o.st[k]}</i>`))
      .concat(`<i>银两 +${o.res.silver}</i>`).join('');
    const on=o.key===ORIGIN_SEL;
    return `<div class="origin${on?' on':''}" data-o="${o.key}" role="radio" aria-checked="${on}">
      <div class="nm">${o.name}</div><div class="ds">${o.desc}</div><div class="st">${chips}</div></div>`;
  }).join('');
  [...document.querySelectorAll('#sp-origins .origin')].forEach(el=>el.onclick=()=>{
    ORIGIN_SEL=el.dataset.o;
    [...document.querySelectorAll('#sp-origins .origin')].forEach(x=>{
      const on=x===el;
      x.classList.toggle('on',on);
      x.setAttribute('aria-checked',String(on));
    });
  });

  const has=(()=>{ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } })();
  if(has){
    const b=document.createElement('button');
    b.className='btn ghost block'; b.id='sp-continue'; b.textContent='继 续 上 次 进 度';
    b.onclick=()=>{ if(load()){ renderAll(); setupAuto(); $('splash').classList.add('hidden'); } else toast('存档已损坏。','bad'); };
    $('sp-start').parentNode.insertBefore(b,$('sp-start'));
  }
  $('sp-start').onclick=()=>{
    const n=($('sp-name').value||'').trim()||'沈砚';
    startGame(n,ORIGIN_SEL,ORIGIN_SEL==='legacy'?loadLegacy():null);
  };
  // 首次渲染一份空壳，避免报错
  S=S||freshState('沈砚','han');
  renderAll();
}
boot();

window.__G={getS:()=>S,setS:(o)=>{S=o},doAct,doPromote,doImpeach,worldTick,resolveEvent,readiness,
  scoreOf,powerOf,impeachRisk,freshState,save,load,startGame,ACTIONS,RANKS,EVENTS,slotStats,RANK_YIELD,
  silverNeedOf,silverScale,verdict,evaluate,endGame,factionTick,createFaction,joinFaction,leaveFaction,donate,trackPeaks,
  jingcha,spawnDebate,resolveEvent,DEBATES,MOODS,moodEff,pushCaseEvent,applyVariant,loadLegacy,applyLegacy,VARIANTS};
})();
</script>
